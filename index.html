<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ThesummerBlog</title>
  <link rel="icon" href="images/blog.png" type="image/png">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Thesummer个人博客 — 致力自我研究~">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link id="theme-style" rel="stylesheet" href="lib/vue.css">





<style>

  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }

  /* 只在 pure 主题时调整字体大小 */
  body.theme-pure .markdown-section {
    font-size: 16px;
  }

  /* 主题选项样式 */

  .theme-option:hover {
  background: #f0f0f0;
  }

  /* 主要内容过渡效果 */

  #main.fade-out {
    opacity: 0;
  }
  #main.fade-in {
    opacity: 1;
  }

  /* 封面图片大小调整 */
  .cover-main img {
    width: 400px;
    height: auto;
    object-fit: cover;
  }
  /* Loading 遮罩 */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
    /* 隐藏遮罩 */
    #loading-overlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  /* 加载条样式 液态毛玻璃 */
  .loader-bar {
  width: 60vw;
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    overflow: hidden;
    margin: 0 auto;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.3);

  }
  /* 加载条内的进度条 液态毛玻璃 */
  .loader-bar .bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, rgba(66,185,131,0.7), rgba(66,185,255,0.7), rgba(255,255,255,0.5));
    animation: loading-bar 0.3s linear forwards, glass-move 0.6s linear infinite;
    backdrop-filter: blur(4px);
  }
  /* 加载动画 液态毛玻璃 */
  @keyframes loading-bar {
    to { width: 100%; }
  }
  /* 液态毛玻璃动画 */
  @keyframes glass-move {
    0% { filter: blur(2px) brightness(1); }
    50% { filter: blur(6px) brightness(1.2); }
    100% { filter: blur(2px) brightness(1); }
  }


  /* 加载文字 */
  .loader-text {
    margin-top: 14px;
    color: #999;
    font-size: 13px;
    letter-spacing: 3px;
    animation: pulse-text 1.4s ease-in-out infinite;
  }
  @keyframes pulse-text {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  
/* ===== 导航栏 Logo 样式 ===== */
.custom-navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 50px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;     /* ← 加这行 */
  padding: 0 20px;
  pointer-events: none;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.nav-logo-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 2px 10px rgba(102, 126, 234, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
}

.nav-logo:hover .nav-logo-badge {
  transform: rotate(-6deg) scale(1.06);
  box-shadow: 0 4px 18px rgba(102, 126, 234, 0.3);
}

.nav-logo-img {
  height: 26px;
  width: 26px;
  object-fit: contain;
  border-radius: 6px;
}

.nav-logo-text {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}


/* ===== 玻璃主题切换滑块 ===== */
.theme-glass-toggle {
  position: fixed;
  top: 9px;
  right: 20px;        /* 改为 20px，避开 app-nav 的菜单 */
  z-index: 999;
  pointer-events: auto;
}

.toggle-track {
  position: relative;
  width: 200px;
  height: 34px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  display: flex;
  align-items: center;
  padding: 2px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.toggle-track:hover {
  background: rgba(255, 255, 255, 0.25);
  box-shadow: 0 4px 32px rgba(102, 126, 234, 0.15);
  border-color: rgba(255, 255, 255, 0.4);
}

.toggle-thumb {
  position: absolute;
  top: 2px;
  left: 3px;
  width: 30px;
  height: 28px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 1px solid rgba(255, 255, 255, 0.5);
}

.thumb-icon {
  font-size: 15px;
  line-height: 1;
}

/* 线条图标统一尺寸（替代 emoji） */
.thumb-icon svg,
.seg-item svg {
  width: 16px;
  height: 16px;
  display: block;
}

.toggle-segments {
  display: flex;
  width: 100%;
  justify-content: space-around;
  padding: 0 6px;
  z-index: 2; /* 图标画在 thumb 高亮底板之上，避免重影 */
}

.seg-item {
  display: flex;              /* svg 是块级元素，text-align 居中不了它，必须用 flex 居中 */
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  padding: 2px 0;
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
  opacity: 0.5;
  flex: 1;
  text-align: center;
}

.seg-item:hover {
  transform: scale(1.25);
  opacity: 0.8;
}

.seg-item.active {
  opacity: 1;
  transform: scale(1.2);
}

/* ===== 调整 Docsify 默认导航位置 ===== */
/* .app-nav {
  left: 220px !important;      放在 Logo 右侧 
  right: auto !important;      取消右对齐 
  top: 12px !important;
}
.app-nav.no-badge {
  right: auto !important;
  left: 220px !important;
} */



/* ===== 导航菜单样式 ===== */
.custom-nav-menu {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 20px;
  pointer-events: auto;
  flex: 1;
}

.nav-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: 500;
  color: inherit;
  text-decoration: none;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
  cursor: pointer;
  white-space: nowrap;
  opacity: 0.78;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.35);
  box-shadow: 0 2px 12px rgba(102, 126, 234, 0.15);
  opacity: 1;
  transform: translateY(-1px);
}

.nav-item .nav-ico {
  width: 16px;
  height: 16px;
  flex: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.nav-item:hover .nav-ico {
  transform: scale(1.12);
}

.nav-dropdown {
  position: relative;
  pointer-events: auto;
}

.drop-trigger {
  user-select: none;
}

.drop-menu {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 6px;
  min-width: 110px;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  padding: 5px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(6px);
  transition: all 0.25s ease;
  z-index: 100;
}

.nav-dropdown:hover .drop-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.drop-menu a {
  display: block;
  padding: 7px 12px;
  font-size: 13px;
  color: inherit;
  text-decoration: none;
  border-radius: 6px;
  transition: background 0.15s ease;
}

.drop-menu a:hover {
  background: rgba(102, 126, 234, 0.12);
}

/* 隐藏 docsify 默认的旧导航 */
.app-nav,
.app-nav.no-badge {
  display: none !important;
}


</style>
</head>
<body>
  <div id="app"></div>

  <!-- 自定义顶部导航栏--logo样式 -->
  <div class="custom-navbar">
    <div class="nav-logo">
      <span class="nav-logo-badge"><img src="images/blog.png" alt="Logo" class="nav-logo-img"></span>
      <span class="nav-logo-text">ThesummerBlog</span>

      <!-- 导航菜单 -->
  <div class="custom-nav-menu">
    <a class="nav-item" href="#/">

      <span>首页</span>

  </div>

  </div>

  <!-- 玻璃主题切换滑块 -->
  <div class="theme-glass-toggle" id="themeGlassToggle">
    <div class="toggle-track">
      <div class="toggle-thumb" id="toggleThumb">
        <span class="thumb-icon" id="thumbIcon"></span>
      </div>
      <div class="toggle-segments" id="toggleSegments">
        <span class="seg-item" data-theme="vue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
        <span class="seg-item" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
        <span class="seg-item" data-theme="pure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span>
        <span class="seg-item" data-theme="dolphin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="M16.01 17.93l-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/></svg></span>
        <span class="seg-item" data-theme="buble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="4"/><circle cx="16.5" cy="14.5" r="2.5"/><circle cx="7.5" cy="17.5" r="1.5"/></svg></span>
      </div>
    </div>

  </div>

    <!-- Loading 遮罩 -->
  <div id="loading-overlay">
    <!-- 加载条 -->
    <div class="loader-bar"><div class="bar"></div></div>
    <div class="loader-text">LOADING</div>
  </div>
  <script>
    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      onlyCover: true,//只显示封面
      loadNavbar: true,
      // 官方推荐（docs/adding-pages.md）：嵌套目录不再逐级回退找 _sidebar/_navbar，直接用根目录的，消除 404
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      plugins: [
        function (hook) {
          // 路由切换前：内容淡出
          hook.beforeEach(function (content) {
            var main = document.getElementById('main');
            if (main) {
              main.classList.add('fade-out');
              setTimeout(function () { main.classList.remove('fade-out'); }, 500);
            }
            return content;
          });
          // 路由切换完成后：内容淡入 + 隐藏 loading 遮罩
          hook.doneEach(function () {
            var main = document.getElementById('main');
            if (main) {
              main.classList.add('fade-in');
              setTimeout(function () { main.classList.remove('fade-in'); }, 500);
            }
            setTimeout(function () {
              document.getElementById('loading-overlay')?.classList.add('hide');
            }, 300); // 延迟 300ms 隐藏遮罩，确保内容加载完成
          });
        }
      ]
};

    (function() {
      // ===== 玻璃滑块 + 主题切换逻辑（主题文件本地化在 lib/，无第三方 CDN 依赖） =====
      var THEMES = ['vue', 'dark', 'pure', 'dolphin', 'buble'];
      var ICONS  = [
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4"/><path d="M16.01 17.93l-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98"/></svg>',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="4"/><circle cx="16.5" cy="14.5" r="2.5"/><circle cx="7.5" cy="17.5" r="1.5"/></svg>'
      ];
      var THEME_PATH = 'lib/';
      var overlayEl = document.getElementById('loading-overlay');

      function getSavedTheme() {
        try { return localStorage.getItem('docsify-theme'); } catch (e) { return null; }
      }

      function applyTheme(theme) {
        document.getElementById('theme-style').href = THEME_PATH + theme + '.css';
        document.body.classList.remove('theme-vue', 'theme-dark', 'theme-pure', 'theme-dolphin', 'theme-buble');
        document.body.classList.add('theme-' + theme);
        try { localStorage.setItem('docsify-theme', theme); } catch (e) {}
      }

      // loading 遮罩随主题变色，避免深色主题下刷新时闪白
      function syncOverlayTheme() {
        if (!overlayEl) return;
        var isDark = getSavedTheme() === 'dark';
        overlayEl.style.background = isDark ? '#3f3f3f' : '#fff';
        overlayEl.style.color = isDark ? '#c8c8c8' : '';
      }

      // 兜底：即使 docsify.min.js 加载失败（hooks 永远不会触发），遮罩也会自动消失，页面不会卡在白屏
      function hideOverlay() {
        if (overlayEl) overlayEl.classList.add('hide');
      }
      setTimeout(hideOverlay, 4000);

      // 立即应用保存的主题，避免刷新时先闪一下默认主题
      var saved = getSavedTheme();
      var currentIndex = THEMES.indexOf(saved) >= 0 ? THEMES.indexOf(saved) : 0;
      applyTheme(THEMES[currentIndex]);
      syncOverlayTheme();

      // ===== 滑块 UI =====
      var thumb = document.getElementById('toggleThumb');
      var segments = document.querySelectorAll('.seg-item');
      var track = document.querySelector('.toggle-track');

      function positionThumb(index) {
        // 滑块被 display:none 隐藏（封面页）时量出的坐标全是 0，必须跳过，等显示时再校准
        if (!track || !track.offsetWidth) return;
        var firstSeg = segments[0];
        var lastSeg = segments[segments.length - 1];
        if (!firstSeg || !lastSeg) return;
        var trackRect = track.getBoundingClientRect();
        var firstRect = firstSeg.getBoundingClientRect();
        var lastRect = lastSeg.getBoundingClientRect();
        var firstCenter = (firstRect.left + firstRect.right) / 2 - trackRect.left - track.clientLeft;
        var lastCenter = (lastRect.left + lastRect.right) / 2 - trackRect.left - track.clientLeft;
        var step = (lastCenter - firstCenter) / (segments.length - 1);
        thumb.style.left = (firstCenter - 15 + step * index) + 'px';
      }

      function setTheme(index) {
        currentIndex = index;
        var theme = THEMES[index];

        positionThumb(index);

        // thumb 只作高亮底板，图标由上层 segments 渲染，避免重影
        segments.forEach(function (el, i) {
          el.classList.toggle('active', i === index);
        });

        applyTheme(theme);
      }

      // 等待 DOM 渲染完成再初始化滑块位置
      setTimeout(function () {
        positionThumb(currentIndex);
      }, 500);

      // 窗口尺寸变化后重新校准 thumb 位置
      window.addEventListener('resize', function () {
        positionThumb(currentIndex);
      });

      // 点击滑块事件
      track.addEventListener('click', function (e) {
        var seg = e.target.closest('.seg-item');
        if (seg) {
          setTheme(Array.from(segments).indexOf(seg));
          return;
        }
        // 点击空白区域切到下一个主题
        setTheme((currentIndex + 1) % THEMES.length);
      });

      // 导航栏/侧边栏中的 .theme-link 主题链接（事件委托，docsify 重渲染后依然有效）
      document.addEventListener('click', function (e) {
        var link = e.target.closest('.theme-link');
        if (!link) return;
        var idx = THEMES.indexOf(link.getAttribute('data-theme'));
        if (idx >= 0) {
          setTheme(idx);
          e.preventDefault();
        }
      });

      // 封面页控制 — 隐藏导航菜单与滑块
      function toggleTopBar() {
        var isCover = !location.hash || location.hash === '#/';
        var bar = document.querySelector('.custom-navbar');
        var slider = document.querySelector('.theme-glass-toggle');
        var display = isCover ? 'none' : '';
        if (bar) bar.style.display = display;
        if (slider) slider.style.display = display;
        // 从封面切到子页面时，重新校准滑块 active 状态与 thumb 位置
        if (!isCover) {
          segments.forEach(function (el, i) {
            el.classList.toggle('active', i === currentIndex);
          });
          // 等浏览器完成显示布局后再量坐标（隐藏期间量出的全是 0）
          requestAnimationFrame(function () {
            positionThumb(currentIndex);
          });
        }
      }
      window.addEventListener('hashchange', toggleTopBar);
      toggleTopBar();
    })();



  </script>
